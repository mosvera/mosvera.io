<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" role="img" aria-label="Mosvera">
  <title>Mosvera</title>
  <!--
    Composed pair. Two equal tesserae (side 100, corner radius 3 = 3%).
    Back tile in ink, front tile offset (+40, -40) in terracotta.
    Their overlap is a true boolean knockout to paper — two primitives
    visibly producing a third region (MEP-0001 composition semantics).
  -->
  <defs>
    <clipPath id="mark-back"><rect x="0" y="40" width="100" height="100" rx="3"/></clipPath>
    <clipPath id="mark-front"><rect x="40" y="0" width="100" height="100" rx="3"/></clipPath>
  </defs>
  <rect x="0" y="40" width="100" height="100" rx="3" fill="#1f1a15"/>
  <rect x="40" y="0" width="100" height="100" rx="3" fill="#c0563a"/>
  <g clip-path="url(#mark-back)">
    <g clip-path="url(#mark-front)">
      <rect x="40" y="40" width="60" height="60" fill="#f5f1e8"/>
    </g>
  </g>
</svg>
